server {
    listen 80;
    server_name psneighborhood.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/psn-acme; }
    location / { return 301 https://psneighborhood.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name psneighborhood.com;
    ssl_certificate /etc/letsencrypt/live/psneighborhood.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psneighborhood.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 33m;
    # Credentials are carried in headers and JSON bodies, never query strings.
    # Avoid logging user operation paths or pairing details.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8794;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 150s;
        proxy_send_timeout 45s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
